<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus · Link Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #080c10;
  --surface:   #0d1117;
  --border:    rgba(255,255,255,0.06);
  --border-hi: rgba(99,202,183,0.3);
  --accent:    #63cab7;
  --safe:      #4ade80;
  --danger:    #f87171;
  --warn:      #fb923c;
  --text:      rgba(255,255,255,0.82);
  --text-dim:  rgba(255,255,255,0.35);
  --text-mid:  rgba(255,255,255,0.55);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Mono', monospace;
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  top: -240px; left: 50%;
  transform: translateX(-50%);
  width: 600px; height: 480px;
  background: radial-gradient(ellipse, rgba(99,202,183,0.06) 0%, transparent 68%);
  pointer-events: none;
  z-index: 0;
}

.wrap {
  position: relative;
  z-index: 1;
  max-width: 720px;
  margin: 0 auto;
  padding: 0 28px 80px;
}

/* Header */
header { padding: 68px 0 48px; }

.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }

.brand-name {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: clamp(24px, 3.5vw, 34px);
  letter-spacing: -0.02em;
  color: #fff;
}

.brand-indicator {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 10px var(--accent), 0 0 20px rgba(99,202,183,0.3);
  animation: glow 3s ease-in-out infinite;
}

@keyframes glow {
  0%,100% { box-shadow: 0 0 8px var(--accent), 0 0 18px rgba(99,202,183,0.25); }
  50%      { box-shadow: 0 0 14px var(--accent), 0 0 30px rgba(99,202,183,0.4); }
}

.sub {
  font-size: 11px; font-weight: 300;
  color: var(--text-dim);
  letter-spacing: 0.12em; text-transform: uppercase;
  margin-bottom: 22px;
}

.status-row { display: flex; gap: 22px; flex-wrap: wrap; }

.pill {
  display: flex; align-items: center; gap: 7px;
  font-size: 10px; color: var(--text-dim);
  letter-spacing: 0.06em; text-transform: uppercase;
}

.dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--safe); box-shadow: 0 0 5px var(--safe);
  animation: blink 2.5s ease-in-out infinite;
}
.dot.d2 { animation-delay: 0.8s; }
.dot.d3 { animation-delay: 1.6s; }

@keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0.2; } }

hr { border: none; border-top: 1px solid var(--border); margin-bottom: 32px; }

/* Input */
.field-label {
  font-size: 9px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--text-dim); margin-bottom: 8px;
}

.input-row { display: flex; gap: 8px; margin-bottom: 12px; }

.url-field {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: 'DM Mono', monospace;
  font-size: 13px; padding: 13px 16px;
  outline: none; border-radius: 4px;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.url-field::placeholder { color: rgba(255,255,255,0.16); }
.url-field:focus {
  border-color: var(--border-hi);
  box-shadow: 0 0 0 3px rgba(99,202,183,0.06);
}

.scan-btn {
  background: var(--accent); border: none;
  color: #080c10;
  font-family: 'Syne', sans-serif; font-weight: 700;
  font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 0 22px; border-radius: 4px;
  cursor: pointer;
  transition: background 0.2s, box-shadow 0.2s, opacity 0.15s;
  white-space: nowrap;
}

.scan-btn:hover { background: #83dfd0; box-shadow: 0 0 18px rgba(99,202,183,0.22); }
.scan-btn:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; }

/* Error */
.error-bar {
  display: none; font-size: 11px; color: var(--danger);
  padding: 10px 14px;
  background: rgba(248,113,113,0.06);
  border: 1px solid rgba(248,113,113,0.18);
  border-radius: 4px; margin-bottom: 12px;
  animation: fadein 0.25s ease;
}
.error-bar.show { display: block; }

/* Loader */
.loader { display: none; padding: 52px 0; text-align: center; }
.loader.show { display: block; }

.spinner {
  width: 44px; height: 44px; border-radius: 50%;
  border: 1px solid rgba(99,202,183,0.15);
  border-top-color: var(--accent);
  margin: 0 auto 18px;
  animation: spin 1.4s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.loader-lbl {
  font-size: 11px; font-weight: 300;
  color: var(--text-dim); letter-spacing: 0.1em; text-transform: uppercase;
  animation: fadepulse 1.5s ease-in-out infinite;
}

.loader-log {
  margin-top: 14px; font-size: 10px;
  color: rgba(99,202,183,0.3);
  line-height: 2; letter-spacing: 0.04em;
}

@keyframes fadepulse { 0%,100% { opacity:0.9; } 50% { opacity:0.3; } }

/* Results */
.results { display: none; margin-top: 28px; animation: fadein 0.35s ease; }
.results.show { display: block; }

@keyframes fadein {
  from { opacity:0; transform: translateY(8px); }
  to   { opacity:1; transform: translateY(0); }
}

/* Verdict */
.verdict {
  display: flex; align-items: center; gap: 20px;
  padding: 22px 24px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 5px; margin-bottom: 8px;
  position: relative; overflow: hidden;
}

.v-bar { position: absolute; left:0; top:0; bottom:0; width:3px; }
.safe   .v-bar { background: var(--safe); }
.danger .v-bar { background: var(--danger); }
.warn   .v-bar { background: var(--warn); }
.unknown .v-bar { background: var(--text-dim); }

.v-glyph { font-size: 20px; opacity: 0.7; flex-shrink:0; width:28px; text-align:center; }
.v-main  { flex: 1; }

.v-status {
  font-family: 'Syne', sans-serif; font-weight: 700;
  font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 4px;
}
.safe   .v-status { color: var(--safe); }
.danger .v-status { color: var(--danger); }
.warn   .v-status { color: var(--warn); }
.unknown .v-status { color: var(--text-dim); }

.v-summary { font-size: 11px; color: var(--text-mid); margin-bottom: 5px; line-height: 1.5; }
.v-url { font-size: 11px; color: var(--text-dim); word-break: break-all; font-weight: 300; }

.v-num { text-align: right; flex-shrink:0; }
.v-count {
  font-family: 'Syne', sans-serif; font-weight: 800;
  font-size: 26px; line-height: 1;
}
.safe   .v-count { color: var(--safe); }
.danger .v-count { color: var(--danger); }
.warn   .v-count { color: var(--warn); }
.unknown .v-count { color: var(--text-dim); }

.v-count-lbl {
  font-size: 9px; color: var(--text-dim);
  letter-spacing: 0.08em; text-transform: uppercase; margin-top: 3px;
}

/* Bar */
.bar-section { margin-bottom: 14px; }

.bar-meta {
  display: flex; justify-content: space-between;
  font-size: 9px; color: var(--text-dim);
  letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px;
}

.bar-track { height: 3px; background: rgba(255,255,255,0.05); border-radius: 2px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 2px; width: 0%; transition: width 1.1s cubic-bezier(0.4,0,0.2,1); }
.bar-fill.s { background: var(--safe);   box-shadow: 0 0 6px rgba(74,222,128,0.4); }
.bar-fill.d { background: var(--danger); box-shadow: 0 0 6px rgba(248,113,113,0.4); }
.bar-fill.w { background: var(--warn);   box-shadow: 0 0 6px rgba(251,146,60,0.4); }

/* Stats */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-bottom: 8px; }

.stat {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 4px; padding: 14px 15px; transition: border-color 0.2s;
}
.stat:hover { border-color: rgba(99,202,183,0.12); }

.s-lbl { font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 6px; }
.s-num { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 21px; line-height: 1; }
.s-num.d { color: var(--danger); } .s-num.w { color: var(--warn); }
.s-num.s { color: var(--safe); }  .s-num.n { color: var(--accent); }
.s-desc { font-size: 9px; color: var(--text-dim); margin-top: 3px; font-weight: 300; }

/* Accordion */
.section {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 4px; margin-bottom: 7px; overflow: hidden;
}

.sec-head {
  padding: 12px 18px; display: flex;
  justify-content: space-between; align-items: center;
  cursor: pointer; user-select: none; transition: background 0.15s;
}
.sec-head:hover { background: rgba(255,255,255,0.02); }

.sec-title { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-mid); }
.sec-chev  { font-size: 9px; color: var(--text-dim); transition: transform 0.22s; }
.sec-chev.open { transform: rotate(90deg); }

.sec-body { display: none; border-top: 1px solid var(--border); padding: 4px 18px 16px; }
.sec-body.open { display: block; }

.row {
  display: flex; gap: 14px; padding: 8px 0;
  border-bottom: 1px solid rgba(255,255,255,0.03); font-size: 11px;
}
.row:last-child { border-bottom: none; }

.r-key { width: 140px; flex-shrink:0; color: var(--text-dim); font-weight: 300; font-size: 10px; }
.r-val { flex: 1; word-break: break-all; }
.r-val.g { color: var(--safe); } .r-val.b { color: var(--danger); } .r-val.w { color: var(--warn); }

/* Engines */
.eng-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(195px, 1fr));
  gap: 5px; max-height: 260px; overflow-y: auto; padding-right: 4px;
}
.eng-grid::-webkit-scrollbar { width: 3px; }
.eng-grid::-webkit-scrollbar-thumb { background: var(--border); }

.eng {
  display: flex; align-items: center; gap: 8px;
  font-size: 10px; padding: 6px 10px; border-radius: 3px;
  background: rgba(255,255,255,0.02);
}
.e-dot { width:5px; height:5px; border-radius:50%; flex-shrink:0; }
.eng.threat .e-dot { background: var(--danger); box-shadow: 0 0 4px var(--danger); }
.eng.clean  .e-dot { background: var(--safe); }
.eng.nodata .e-dot { background: rgba(255,255,255,0.12); }

.e-name { flex:1; color: var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.eng.threat .e-name { color: rgba(248,113,113,0.8); }
.e-tag { font-size:9px; color: rgba(255,255,255,0.18); text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:80px; }
.eng.threat .e-tag { color: rgba(248,113,113,0.45); }

/* JSON */
.json-pre {
  font-size: 10px; font-weight: 300; color: rgba(99,202,183,0.5);
  white-space: pre-wrap; word-break: break-all;
  max-height: 260px; overflow-y: auto; line-height: 1.7;
}
.json-pre::-webkit-scrollbar { width: 3px; }
.json-pre::-webkit-scrollbar-thumb { background: var(--border); }

footer {
  text-align: center; padding: 24px 0 16px;
  font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase;
  color: rgba(255,255,255,0.13);
}
footer em { color: rgba(99,202,183,0.28); font-style: normal; }

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.07); border-radius: 3px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <span class="brand-name">Nexus</span>
      <span class="brand-indicator"></span>
    </div>
    <div class="sub">Link Intelligence &amp; Threat Analysis</div>
    <div class="status-row">
      <div class="pill"><span class="dot"></span> VirusTotal Active</div>
      <div class="pill"><span class="dot d2"></span> 90+ Engines</div>
      <div class="pill"><span class="dot d3"></span> Real-time Scan</div>
    </div>
  </header>

  <hr>

  <div class="field-label">URL to analyse</div>
  <div class="input-row">
    <input type="text" id="urlInput" class="url-field"
      placeholder="https://example.com"
      autocomplete="off" spellcheck="false" />
    <button class="scan-btn" id="scanBtn" onclick="scanURL()">Scan</button>
  </div>

  <div class="error-bar" id="errorBar"></div>

  <div class="loader" id="loader">
    <div class="spinner"></div>
    <div class="loader-lbl" id="loaderLbl">Analysing</div>
    <div class="loader-log" id="loaderLog"></div>
  </div>

  <div class="results" id="results"></div>
</div>

<footer>Nexus &nbsp;·&nbsp; <em>Powered by VirusTotal</em> &nbsp;·&nbsp; Chatbot-ready API</footer>

<script>
// ── Config ─────────────────────────────────────────────────
// The backend runs on the same host in production.
// In development, point this to http://localhost:3000
const API_BASE = '';  // empty = same origin (production default)

// ── State ──────────────────────────────────────────────────
let busy = false;

// ── Accordion ──────────────────────────────────────────────
document.addEventListener('click', e => {
  const h = e.target.closest('.sec-head');
  if (!h) return;
  const b = h.nextElementSibling;
  const c = h.querySelector('.sec-chev');
  b.classList.toggle('open');
  c.classList.toggle('open', b.classList.contains('open'));
});

// ── Helpers ────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const esc = s => String(s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function showError(msg) {
  const el = $('errorBar');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 8000);
}

function setLoader(on, lbl) {
  $('loader').classList.toggle('show', on);
  if (lbl) $('loaderLbl').textContent = lbl;
}

function log(msg) { $('loaderLog').innerHTML += `<div>${msg}</div>`; }

// ── Scan ───────────────────────────────────────────────────
async function scanURL() {
  if (busy) return;
  const url = $('urlInput').value.trim();

  $('errorBar').classList.remove('show');
  $('results').classList.remove('show');
  $('results').innerHTML = '';

  if (!url) { showError('Please enter a URL.'); return; }

  busy = true;
  $('scanBtn').disabled = true;
  $('loaderLog').innerHTML = '';
  setLoader(true, 'Connecting');
  log('→ Submitting to server…');

  try {
    log('→ Scanning across 90+ engines…');
    setLoader(true, 'Scanning');

    const res = await fetch(`${API_BASE}/api/scan`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url }),
    });

    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error || `Server error ${res.status}`);
    }

    log('→ Done. Rendering report…');
    setLoader(false);
    render(data);

  } catch (err) {
    setLoader(false);
    showError(err.message || 'Unexpected error. Is the server running?');
    console.error(err);
  }

  busy = false;
  $('scanBtn').disabled = false;
}

// ── Render ─────────────────────────────────────────────────
function render(r) {
  const vc = r.verdict === 'clean' ? 'safe'
           : r.verdict === 'malicious' ? 'danger'
           : r.verdict === 'suspicious' ? 'warn'
           : 'unknown';

  const glyph = vc === 'safe' ? '◎' : vc === 'danger' ? '⬡' : vc === 'warn' ? '◈' : '◇';
  const barCls = vc === 'safe' ? 's' : vc === 'danger' ? 'd' : 'w';
  const pct = r.threat_percent || 0;

  const s = r.stats || {};
  const mal = s.malicious  || 0;
  const sus = s.suspicious || 0;
  const har = s.harmless   || 0;
  const und = s.undetected || 0;
  const tot = s.total      || 1;

  const m = r.metadata || {};
  const cats = (r.categories || []).join(', ') || '—';
  const rep  = r.reputation ?? '—';

  // Engine list
  const engHTML = (r.threats_detected || []).map(e =>
    `<div class="eng threat">
      <span class="e-dot"></span>
      <span class="e-name">${esc(e.engine)}</span>
      <span class="e-tag">${esc(e.result || e.category)}</span>
    </div>`
  ).join('') || '<div style="font-size:10px;color:var(--text-dim);padding:8px 0">No threats detected by any engine.</div>';

  $('results').innerHTML = `
    <div class="verdict ${vc}">
      <div class="v-bar"></div>
      <div class="v-glyph">${glyph}</div>
      <div class="v-main">
        <div class="v-status">${r.verdict?.toUpperCase() || 'UNKNOWN'}</div>
        <div class="v-summary">${esc(r.summary || '')}</div>
        <div class="v-url">${esc(r.url)}</div>
      </div>
      <div class="v-num">
        <div class="v-count">${r.threat_count ?? 0}</div>
        <div class="v-count-lbl">threats</div>
      </div>
    </div>

    <div class="bar-section">
      <div class="bar-meta"><span>Threat Exposure</span><span>${pct}% · ${r.threat_count} / ${tot} engines</span></div>
      <div class="bar-track"><div class="bar-fill ${barCls}" id="bf"></div></div>
    </div>

    <div class="stats">
      <div class="stat"><div class="s-lbl">Malicious</div><div class="s-num ${mal>0?'d':'n'}">${mal}</div><div class="s-desc">engines</div></div>
      <div class="stat"><div class="s-lbl">Suspicious</div><div class="s-num ${sus>0?'w':'n'}">${sus}</div><div class="s-desc">engines</div></div>
      <div class="stat"><div class="s-lbl">Harmless</div><div class="s-num ${har>0?'s':'n'}">${har}</div><div class="s-desc">engines</div></div>
      <div class="stat"><div class="s-lbl">Undetected</div><div class="s-num n">${und}</div><div class="s-desc">no verdict</div></div>
      <div class="stat"><div class="s-lbl">Reputation</div><div class="s-num ${rep<0?'d':rep>0?'s':'n'}">${rep}</div><div class="s-desc">community</div></div>
      <div class="stat"><div class="s-lbl">Threat Score</div><div class="s-num ${pct>20?'d':pct>5?'w':'s'}">${pct}%</div><div class="s-desc">of engines</div></div>
    </div>

    <div class="section">
      <div class="sec-head"><span class="sec-title">URL Intelligence</span><span class="sec-chev open">▶</span></div>
      <div class="sec-body open">
        <div class="row"><span class="r-key">Final URL</span><span class="r-val">${esc(m.final_url || r.url)}</span></div>
        <div class="row"><span class="r-key">Page Title</span><span class="r-val">${esc(m.title || '—')}</span></div>
        <div class="row"><span class="r-key">HTTP Status</span><span class="r-val ${(m.http_status||0)>=400?'w':''}">${m.http_status||'—'}</span></div>
        <div class="row"><span class="r-key">Content Type</span><span class="r-val">${esc(m.content_type||'—')}</span></div>
        <div class="row"><span class="r-key">Categories</span><span class="r-val">${esc(cats)}</span></div>
        <div class="row"><span class="r-key">First Submitted</span><span class="r-val">${m.first_submitted ? new Date(m.first_submitted).toLocaleDateString() : '—'}</span></div>
        <div class="row"><span class="r-key">Last Analysed</span><span class="r-val">${m.last_analysed ? new Date(m.last_analysed).toLocaleDateString() : '—'}</span></div>
      </div>
    </div>

    <div class="section">
      <div class="sec-head"><span class="sec-title">Threats Detected · ${r.threat_count || 0}</span><span class="sec-chev open">▶</span></div>
      <div class="sec-body open">
        <div class="eng-grid">${engHTML}</div>
      </div>
    </div>

    <div class="section">
      <div class="sec-head"><span class="sec-title">JSON Report</span><span class="sec-chev">▶</span></div>
      <div class="sec-body">
        <pre class="json-pre">${esc(JSON.stringify(r, null, 2))}</pre>
      </div>
    </div>
  `;

  $('results').classList.add('show');
  requestAnimationFrame(() => setTimeout(() => {
    const bf = $('bf');
    if (bf) bf.style.width = pct + '%';
  }, 80));
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.activeElement.id === 'urlInput') scanURL();
});
</script>
</body>
</html>
