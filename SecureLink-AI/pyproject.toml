[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "data/",
    "models/",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "F401",   # imported but unused (some __init__.py re-exports)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811"]  # Redefinition in test fixtures is normal
